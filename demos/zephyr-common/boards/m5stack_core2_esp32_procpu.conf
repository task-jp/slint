# Slint renders into a heap buffer and runs the event loop on the main
# thread; give it room.
CONFIG_MAIN_STACK_SIZE=65536

# The touch controller is an FT6336U. Its interrupt line never asserts on
# this board, so the driver never sees a touch. Poll it over I2C instead,
# which is what the vendor examples for this board do.
CONFIG_INPUT_FT5336_INTERRUPT=n
CONFIG_INPUT_FT5336_PERIOD=20

# The Core2 ships 8 MB of PSRAM; the ESP32 maps 4 MB of it. Feed it to
# the shared multi heap, where spiram_heap.c points the C allocator.
CONFIG_ESP_SPIRAM=y
# Zephyr 自前の malloc を外し, spiram_heap.c の実装に置き換える
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
# 4 MB のヒープは small-only の sys_heap では扱えない
CONFIG_SYS_HEAP_AUTO=y
