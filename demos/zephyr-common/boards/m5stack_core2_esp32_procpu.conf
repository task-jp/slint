# Slint renders into a heap buffer and runs the event loop on the main
# thread; give it room.
CONFIG_MAIN_STACK_SIZE=32768

# The touch controller is an FT6336U. Its interrupt line never asserts on
# this board, so the driver never sees a touch. Poll it over I2C instead,
# which is what the vendor examples for this board do.
CONFIG_INPUT_FT5336_INTERRUPT=n
CONFIG_INPUT_FT5336_PERIOD=20
